name: Web

on:
  push:
    branches: [main]
    paths: ['apps/web/**']
  pull_request:
    paths: ['apps/web/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      # Le formatage du site est vérifié ici (la CI app ignore apps/web/**), avec le
      # biome de la racine : une seule version épinglée pour tout le dépôt.
      - run: npm ci
      - run: npx biome format apps/web
      - run: npm ci
        working-directory: apps/web
      - run: npm run check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
