name: CI

# Le site (web/**) a sa propre CI, sauf sa table de routes : src/lib/urls.test.ts
# vérifie que l'app ouvre bien les chemins qu'elle déclare. Motifs lus dans
# l'ordre, le dernier qui correspond l'emporte.
on:
  push:
    branches: [main]
    paths: ['**', '!web/**', 'web/src/i18n/index.ts']
  pull_request:
    paths: ['**', '!web/**', 'web/src/i18n/index.ts']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
        env:
          CI: '1'
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
