name: CI

# Le site (apps/web/**) a sa propre CI, sauf sa table de routes :
# apps/mobile/src/lib/urls.test.ts vérifie que l'app ouvre bien les chemins
# qu'elle déclare. Motifs lus dans l'ordre, le dernier qui correspond l'emporte.
on:
  push:
    branches: [main]
    paths: ['**', '!apps/web/**', 'apps/web/src/i18n/index.ts']
  pull_request:
    paths: ['**', '!apps/web/**', 'apps/web/src/i18n/index.ts']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      # Racine : formatage de tout le dépôt et tests des Edge Functions (dont le
      # barème que l'app embarque). Pas de workspaces npm : deux installations.
      - run: npm ci
      - run: npm run format:check
      - run: npm test

      - run: npm ci
        working-directory: apps/mobile
      - run: npm run lint -- --max-warnings 0
        working-directory: apps/mobile
        env:
          CI: '1'
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npm test
        working-directory: apps/mobile
