<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/trycast-design-system-a0f4ea97-0d6d-4fdd-ac49-400152185bc0/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/trycast-design-system-a0f4ea97-0d6d-4fdd-ac49-400152185bc0/tokens/colors.css">
  <link rel="stylesheet" href="_ds/trycast-design-system-a0f4ea97-0d6d-4fdd-ac49-400152185bc0/tokens/typography.css">
  <link rel="stylesheet" href="_ds/trycast-design-system-a0f4ea97-0d6d-4fdd-ac49-400152185bc0/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/trycast-design-system-a0f4ea97-0d6d-4fdd-ac49-400152185bc0/styles.css">
  <script src="_ds/trycast-design-system-a0f4ea97-0d6d-4fdd-ac49-400152185bc0/_ds_bundle.js"></script>
</helmet>
<div role="button" tabindex="0" onClick="{{ onOpen }}" style="display: flex; flex-direction: column; gap: 11px; padding: 14px 14px 0; background: var(--surface); border: 1.5px solid color-mix(in srgb, var(--accent) 38%, var(--border)); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); cursor: pointer; -webkit-tap-highlight-color: transparent; overflow: hidden; transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);" style-hover="box-shadow: var(--shadow-lg);" style-active="transform: scale(0.985);">

  <!-- overline -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <span style="display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--accent); white-space: nowrap;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="flex: none;"><path d="M12 2l2.4 6.4L21 9l-5 4.2L17.6 20 12 16.3 6.4 20 8 13.2 3 9l6.6-.6z"></path></svg>
      {{ overline }}
    </span>
    <span style="flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); white-space: nowrap;">{{ journeeLabel }}</span>
  </div>

  <!-- titre + accroche -->
  <div style="display: flex; flex-direction: column; gap: 5px;">
    <span style="font-family: var(--font-display); font-size: 25px; line-height: 1.05; letter-spacing: 0.01em; color: var(--text); text-wrap: pretty;">{{ title }}</span>
    <span style="font-size: 13px; line-height: 1.45; color: var(--text-muted); text-wrap: pretty;">{{ accroche }}</span>
  </div>

  <!-- badges -->
  <sc-if value="{{ hasBadges }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="1">
        <span style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--radius-pill); border: 1px solid {{ b.border }}; color: {{ b.color }}; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap;">
          <sc-if value="{{ b.isJoker }}" hint-placeholder-val="{{ false }}"><span style="font-family: var(--font-display); font-size: 12px; line-height: 1;">×2</span></sc-if>
          {{ b.label }}
        </span>
      </sc-for>
    </div>
  </sc-if>

  <!-- match commun (cas « même match ») -->
  <sc-if value="{{ sameMatch }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 9px; padding: 9px 11px; background: var(--surface-sunken); border-radius: var(--radius-sm);">
      <x-import component-from-global-scope="TryCastDesignSystem_a0f4ea.TeamFlag" abbr="{{ match.homeAbbr }}" color="{{ match.homeColor }}" size="sm" hint-size="34px,26px"></x-import>
      <span style="flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: {{ match.homeNameColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ match.homeName }}</span>
      <span style="flex: none; font-family: var(--font-display); font-size: 20px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0.02em;">{{ match.scoreStr }}</span>
      <span style="flex: 1; min-width: 0; text-align: right; font-size: 12.5px; font-weight: 600; color: {{ match.awayNameColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ match.awayName }}</span>
      <x-import component-from-global-scope="TryCastDesignSystem_a0f4ea.TeamFlag" abbr="{{ match.awayAbbr }}" color="{{ match.awayColor }}" size="sm" hint-size="34px,26px"></x-import>
    </div>
  </sc-if>

  <!-- lauréat(s) -->
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{ entries }}" as="e" hint-placeholder-count="1">
      <div style="display: flex; align-items: center; gap: 10px;">
        <x-import component-from-global-scope="TryCastDesignSystem_a0f4ea.Avatar" name="{{ e.name }}" size="{{ e.avatarSize }}" ring="{{ e.isMe }}" hint-size="40px,40px"></x-import>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="display: flex; align-items: center; gap: 6px; min-width: 0;">
            <span style="min-width: 0; font-size: 14.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ e.displayName }}</span>
            <sc-if value="{{ e.joker }}" hint-placeholder-val="{{ false }}">
              <span title="Joker ×2 posé sur ce match" style="flex: none; display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: var(--radius-pill); border: 1px solid color-mix(in srgb, var(--brand) 55%, transparent); color: var(--brand); font-family: var(--font-display); font-size: 12px; line-height: 1; letter-spacing: 0.02em;">×2</span>
            </sc-if>
          </span>
          <span style="font-size: 11.5px; font-weight: 600; color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ e.subline }}</span>
        </span>
        <span style="flex: none; display: inline-flex; align-items: baseline; gap: 3px;">
          <span style="font-family: var(--font-display); font-size: {{ e.ptsSize }}; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums;">{{ e.ptsStr }}</span>
          <span style="font-size: 11px; font-weight: 700; color: var(--accent);">pts</span>
        </span>
      </div>
    </sc-for>
  </div>

  <!-- l'histoire : lui contre la ligue -->
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 12.5px; line-height: 1.4; color: var(--text); text-wrap: pretty;">{{ storyText }}</span>
    <div style="display: flex; gap: 3px; height: 6px;">
      <span style="flex: {{ story.majority }}; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent);"></span>
      <span style="flex: {{ story.mine }}; border-radius: 3px; background: var(--accent);"></span>
    </div>
  </div>

  <!-- affordance réaction -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 -14px; padding: 10px 14px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--accent) 5%, transparent);">
    <span style="display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--text-muted);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.4-.6L3 21l1.8-4.6A8.4 8.4 0 1 1 21 11.5z"></path><path d="M9.5 11h5M12 8.5v5"></path></svg>
      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ ctaText }}</span>
    </span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: var(--text-faint);"><path d="M9 6l6 6-6 6"></path></svg>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:420},&quot;data&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;CoupDuJourData&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const d = this.props.data || {};
    const entries = (d.entries || []).map((e) => ({
      ...e,
      displayName: e.name,
      isMe: !!e.isMe,
      avatarSize: (d.entries || []).length > 1 ? 'sm' : 'md',
      ptsSize: (d.entries || []).length > 1 ? '24px' : '34px',
      ptsStr: '+' + e.pts,
      subline: e.subline,
    }));
    const badges = (d.badges || []).map((b) => ({
      label: b.label,
      isJoker: !!b.joker,
      color: b.joker ? 'var(--brand)' : 'var(--text-muted)',
      border: b.joker ? 'color-mix(in srgb, var(--brand) 55%, transparent)' : 'var(--border-strong)',
    }));
    const m = d.match || {};
    const winner = (m.hs || 0) > (m.as || 0) ? 'home' : ((m.hs || 0) < (m.as || 0) ? 'away' : 'draw');
    return {
      overline: d.overline || 'Coup de la journée',
      journeeLabel: d.journeeLabel || '',
      title: d.title || '',
      accroche: d.accroche || '',
      badges,
      hasBadges: badges.length > 0,
      sameMatch: !!d.match,
      match: {
        homeAbbr: m.homeAbbr, homeColor: m.homeColor, homeName: m.homeName,
        awayAbbr: m.awayAbbr, awayColor: m.awayColor, awayName: m.awayName,
        scoreStr: m.hs + ' – ' + m.as,
        homeNameColor: winner === 'away' ? 'var(--text-muted)' : 'var(--text)',
        awayNameColor: winner === 'home' ? 'var(--text-muted)' : 'var(--text)',
      },
      entries,
      storyText: d.storyText || '',
      story: { majority: (d.story && d.story.majority) || 7, mine: (d.story && d.story.mine) || 2 },
      ctaText: d.ctaText || 'Va réagir sur le détail du match',
      onOpen: d.onOpen || (() => {}),
    };
  }
}

</script>
</body>
</html>
